context:
  build_number: 4
  name: ocaml-dune
  version: "3.24.2"

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ "sh" if unix else "bat" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/ocaml/dune/archive/${{ version }}.tar.gz
    sha256: 3c4facfef1bc1f96235808865665b94857e6e508ce346bfc36b53b775fd8423c

build:
  number: ${{ build_number }}
  # Mirrors ocaml-feedstock's build string. Referencing c_compiler here is
  # also what marks it a used variant key, which is what actually splits
  # win_64 into two lanes; a variant key nothing references is pruned.
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - if: not unix
        then:
          - C:/Windows/system32/SHLWAPI.dll
          - C:/Windows/system32/VERSION.dll

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("ocaml") }}
      else:
        # ocaml_win-64 publishes gcc_* and vs2022_* at the SAME build
        # number, so the unpinned spec that compiler("ocaml") expands to is
        # settled by upload order - the newer artifact wins, and the two
        # ship different closures. Pin the build string to this lane's
        # variant so the choice is the recipe's, not the mirror's.
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_compiler }}_*
    # Pins the sysroot the C toolchain targets and records the resulting
    # __glibc floor on the package; the C compiler itself already comes in
    # through ocaml_${{ target_platform }}.
    - ${{ stdlib("c") }}
    - ${{ m2 }}bash >=5.2
    - ${{ m2 }}gawk
    - ${{ m2 }}grep
    - ${{ m2 }}make
    - ${{ m2 }}sed
    - if: build_platform != target_platform
      then:
        - ocaml-dune
        - zstd
    - if: unix
      then:
        - file
      else:
        - ${{ m2 }}coreutils
        - ${{ m2 }}diffutils
        - ${{ m2 }}which
  host:
    - zstd
  run:
    - if: unix
      then:
        - ocaml_${{ target_platform }}
      else:
        # ocaml_win-64's run_exports carry only the C stdlib, never ocaml
        # itself, so nothing constrains the variant at install time and a
        # gcc-built ocaml-dune can be paired with the vs2022 ocaml. Mirror the
        # build-time glob to make the pairing explicit. Prefix glob, not a full
        # build string: gcc_* survives hash churn and build_number bumps.
        - ocaml_${{ target_platform }} * ${{ c_compiler }}_*
  ignore_run_exports:
    by_name:
      - zstd

tests:
  # Package contents validation
  - package_contents:
      strict: true
      bin:
        - dune
      files:
        - ${{ library }}doc/dune/CHANGES.md
        - ${{ library }}doc/dune/LICENSE.md
        - ${{ library }}doc/dune/README.md
        - ${{ library }}doc/dune/odoc-pages/index.mld
        - ${{ library }}lib/dune/META
        - ${{ library }}lib/dune/dune-package
        - ${{ library }}lib/dune/opam
        - ${{ library }}share/man/man1/*
        - ${{ library }}share/man/man5/dune-config.5
        - ${{ library }}share/emacs/site-lisp/dune/dune-{flymake,watch}.el
        - ${{ library }}share/emacs/site-lisp/dune/dune.el
        - etc/conda/activate.d/dune-activate.${{ sh }}
        - etc/conda/deactivate.d/dune-deactivate.${{ sh }}
        - etc/conda/test-files/*

  # Python-based functional tests (all arm64 lanes are native)
  - script: |
      python testing/run_all_tests.py
    files:
      recipe:
        - testing/test_utils.py
        - testing/run_all_tests.py
        - testing/probe-dune-cache.py
        - testing/test-dune-activation.py
        - testing/test-dune-arch.py
        - testing/test-dune-build.py
        - testing/test-dune-cmi.py
        - testing/test-dune-config.py
        - testing/test-dune-stubs.py
        - testing/test-dune-version.py
    requirements:
      run:
        - ${{ m2 }}file
        - binutils
        - ocaml-compiler
        - python >=3.9

about:
  license: MIT
  license_file: LICENSE.md
  summary: A composable build system for OCaml.
  homepage: https://dune.build/
  repository: https://github.com/ocaml/dune

extra:
  recipe-maintainers:
    - MementoRC
